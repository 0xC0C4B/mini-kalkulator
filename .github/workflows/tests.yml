name: Testi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Prenesi repozitorij
        uses: actions/checkout@v4
      - name: Nastavi Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Zaženi enotske teste
        run: python -m unittest discover -s tests -v
